<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="slide2.css">
    <title>Base</title>
</head>
<body>
    <div id="content">
        <div id="top">

            <div id="linha1"></div>
            <h1 id="conceito">Conceito</h1>
            <p id="textin">Humanos avaliando IAs usando <span class="palavras">regras</span><br><span class="palavras">escritas</span>, não opiniões.</p>

        </div>

        <div id="meio">
            <h1>O Processo</h1>
            <p>(Esquema visual)</p>
            <div id="linha2"></div>
        </div>

        <div id="low">

            <div class="item" id="div1">
                <div class="icon" style="--icon: url('img/texto.png')"></div>
                <p id="ex1">Prompt</p>
            </div>

            <div class="item" id="div2">
                <div class="icon" style="--icon: url('img/IA.png')" id="ia"></div>
                <p id="ex2">IA Gera Resposta</p>
            </div>

            <div class="item" id="div3">
                <div class="icon" style="--icon: url('img/user.png')" id="ceguin"></div>
                <p id="ex3">Avaliador "Cego"</p>
            </div>

            <div class="item" id="div4">
                <div class="icon" style="--icon: url('img/prancheta.png')" id="pranxota"></div>
                <p id="ex4">Avaliando usando <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a Rubrica</p>
            </div>

            <div class="item" id="div5">
                <div class="icon" style="--icon: url('img/estrela.png')"></div>
                <p id="ex5">Nota Final</p>
            </div>

        </div>

    </div>


    <footer class="botaos">
            <button id="esquerda">←</button>
            <button id="direita">→</button>
    </footer>

    <script src="slide2.js"></script>
</body>
</html>
