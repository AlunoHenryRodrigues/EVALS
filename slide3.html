<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="slide3.css">
    <title>Slide 3</title>
</head>
<body>
    <div id="content">
        <div id="top">

            <div id="linha1"></div>
            <h1 id="comparacao">Comparação</h1>
            <p id="textin">O mesmo objetivo, mas com abordagens muito diferentes.</p>

        </div>

        <div id="meio">
            <div id="left">
                <div id="left-top">
                    <img src="img/X.png" alt="" class="x">
                    <h1>Ruim</h1>
                    <p>(Achismo)</p>
                </div>
                <div id="left-meio">
                    <p>"Dê uma nota de 0 a 10 <br>para a qualidade."</p>
                </div>
                <div id="left-low">
                    <div id="left-low-top">
                        <img src="img/danger.png" alt="">
                        <p>Gera confusão e ruído.</p>
                    </div>
                    
                    <div class="notas">
                        <img src="img/nota-7.png" alt="" class="nota">
                        <img src="img/nota-65.png" alt="" class="nota">
                        <img src="img/nota-9.png" alt="" class="nota">
                    </div>
                </div>
            </div>

            <img src="img/vs.png" alt="" class="vs">

            <div id="right">
                <div class="right-top">
                    <img src="img/V.png" alt="" class="check">
                    <h1>Bom</h1>
                    <p>(Rubrica)</p>
                </div>

                <div class="right-meio">
                    <img src="img/folha.png" alt="" class="folha">    
                    <p>Critérios Binários (Sim/Não) <br>ou Descritivos.</p>
                </div>

                <div class="right-low">
                    <p class="ex">Exemplo:</p>
                    <p class="pergunta">A resposta usou o formato <br>de tópicos?</p>
                    <div class="sn">
                        <p><b>(&nbsp;&nbsp;&nbsp;) Sim</b></p>
                        <p><b>(&nbsp;&nbsp;&nbsp;) Não</b></p>
                    </div>
                    
                </div>
            </div>
        </div>

    </div>


    <footer class="botaos">
            <button id="esquerda">←</button>
            <button id="direita">→</button>
    </footer>

    <script src="slide3.js"></script>
</body>
</html>
